{% extends 'healthapp/base.html' %}

{% block content %}
<div class="row justify-content-center mt-2">
    <!-- Responsive column: 100% on mobile, 8/12 on tablet, 6/12 on desktop -->
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card p-4 shadow-sm border-0">

            <!-- Form Header -->
            <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
                <i class="bi bi-person-plus-fill fs-3 text-primary me-3"></i>
                <h3 class="mb-0 fw-bold">{{ action }} Patient Record</h3>
            </div>

            <form method="post">
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small">{{ field.label }}</label>

                        {{ field }}

                        {% if field.help_text %}
                            <div class="form-text small">{{ field.help_text }}</div>
                        {% endif %}

                        {% if field.errors %}
                            <div class="alert alert-danger py-1 px-2 mt-2 mb-0 small d-flex align-items-center">
                                <i class="bi bi-exclamation-circle-fill me-2"></i>
                                {{ field.errors.0 }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <!-- Responsive Buttons: Stack on mobile, side-by-side on larger screens -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4 pt-3 border-top">
                    <a href="{% url 'patient_list' %}" class="btn btn-light border fw-bold text-secondary me-md-2">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">
                        <i class="bi bi-check2-circle me-1"></i> Save Record
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
