{% extends 'healthapp/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <h3 class="text-danger mb-3"><i class="bi bi-exclamation-triangle-fill me-2"></i>Delete Record</h3>
            <p class="fs-5">Are you sure you want to delete <br><strong>{{ record.full_name }}</strong>?</p>
            <p class="text-muted small">This action cannot be undone.</p>
            
            <form method="post" class="mt-4">
                {% csrf_token %}
                <a href="{% url 'patient_list' %}" class="btn btn-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
