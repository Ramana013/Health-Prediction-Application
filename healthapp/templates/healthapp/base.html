<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Prediction App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .content-wrapper {
            flex: 1; /* Pushes the footer to the bottom */
        }
        .navbar-custom {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
            color: white !important;
        }
        .card {
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            border-radius: 10px;
        }
        footer {
            background-color: #212529;
            color: #adb5bd;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'patient_list' %}">
                <i class="bi bi-heart-pulse-fill me-2"></i> HealthPredict
            </a>
            <div class="d-flex">
                <a href="{% url 'patient_list' %}" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
                <a href="{% url 'patient_create' %}" class="btn btn-light btn-sm text-primary fw-bold">+ New Record</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container content-wrapper">
        {% block content %}
        <!-- Other pages will inject their content here -->
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer class="text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; {% now "Y" %} Health Prediction App | Gokul Infocare Task. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
